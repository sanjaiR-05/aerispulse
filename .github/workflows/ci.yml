name: CI / CD Production Verification Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Strict Engineering & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Verification
        run: npm run typecheck

      - name: ESLint Code Quality Inspection
        run: npm run lint

      - name: Vitest Comprehensive Automated Test Suite (170+ tests)
        run: npm run test

      - name: Production Next.js 15 App Build
        run: npm run build

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=critical || true
